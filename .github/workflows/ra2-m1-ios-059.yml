name: CnC RA2 iOS Host

on:
  push:
    branches:
      - secondsun/ra2-m1-ios-059-ea108
      - secondsun/ra2-m1-ios-060-cnc-ra2-factory
      - secondsun/ra2-m1-ios-061-data-user-stage
      - secondsun/ra2-m1-ios-066-physical-polish
      - secondsun/ra2-m1-ios-067-resolution-regression
      - secondsun/ra2-m1-ios-068-soviet-maps02
      - secondsun/ra2-m1-ios-069-tap-start-handoff
      - secondsun/ra2-m1-ios-070-save-audio-recovery
      - secondsun/ra2-m1-ios-073-streamed-cursor-cache-bypass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-ra2-ios-070-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple-source-only:
    name: iPhoneOS ARM64 compile, custody and lifecycle proof
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VITE_RA2_SOUND_POSITION_CACHE_BYPASS: '1'
    steps:
      - name: Checkout source only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version
          xcodebuild -version

      - name: Install NASM
        run: brew install nasm

      - name: Install source dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting and Route B sources
        run: |
          pnpm run format:check
          pnpm exec prettier --check \
            .github/workflows/ra2-m1-ios-059.yml \
            docs/RA2_M1_IOS_HANDOFF.md ios/RA2M1/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json \
            scripts/ios/preparePublicBundle.mjs scripts/ios/verifyAppleApp.mjs scripts/ios/verifySourceOnly.mjs scripts/ci/processes.ts \
            src/adapter/runtime.ts src/adapter/vmProtocol.ts src/adapter/vmWorkerController.ts src/main.ts src/platform/browser/nativeDiagnostics.ts \
            src/adapter/audio.ts src/adapter/pcmStreamWorklet.js src/adapter/vmClient.ts src/contracts/moviePlayback.ts src/contracts/fileMetadata.ts \
            src/adapter/vmCore.ts src/adapter/vmLifecycle.ts src/adapter/vmProtocol.ts src/adapter/vmWorkerController.ts src/adapter/runtimeLifecycleCoordinator.ts src/adapter/rangePrefetch.ts src/adapter/vmShell.ts src/adapter/fileSearch.ts \
            src/contracts/moviePlayback.ts \
            src/app/session/runtimeEvents.ts src/app/session/vmSessionController.ts src/vm86/win32.ts src/vm86/shim/stateFiles.ts src/vm86/shim/kernel32.ts src/vm86/shim/fileSearch.ts src/resources/contracts.ts src/resources/providers/scoped.ts src/resources/providers/overlay.ts src/platform/browser/files/writeCache.ts src/platform/browser/files/http.ts src/platform/browser/files/sessionFiles.ts \
            src/vm86/clock.ts src/vm86/shim/state.ts \
            src/platform/browser/ea108MobileHost.ts src/platform/browser/files/directoryAccess.ts src/platform/browser/files/http.ts \
            src/ui/pages/game/page.ts src/ui/pages/game/AppShell.tsx src/ui/pages/game/components/RuntimeToolbarView.tsx src/ui/pages/game/gameInput.ts src/ui/pages/game/iosTapToStartGate.ts src/ui/pages/game/styles.css src/ui/pages/game/vmPageResolution.ts src/ui/pages/game/vmPageRuntimeCallbacks.ts src/ui/pages/game/touchControls.ts src/ui/pages/game/state/uiState.ts src/ui/shared/components/UiErrorBoundary.tsx tests/basic/ciConfiguration.test.ts tests/basic/ea108MobileHost.test.ts tests/basic/uiState.test.ts \
            tests/basic/vmSessionController.test.ts tests/basic/browser/tapToStartGateBrowserSmoke.mts tests/basic/browser/audioGestureRecoveryBrowserSmoke.mts tests/basic/browser/coldSaveLoadPersistenceBrowserSmoke.mts \
            tests/basic/gameInput.test.ts tests/basic/moviePlayback.test.ts tests/basic/clock.test.ts tests/basic/runtimeLifecycleCoordinator.test.ts tests/basic/canvasFit.test.ts tests/basic/input.test.ts tests/basic/resolution.test.ts tests/basic/pageStartup.test.ts tests/basic/vmClient.test.ts tests/basic/vmCore.test.ts tests/basic/vmWorkerController.test.ts tests/basic/audioWorkletResampling.test.ts tests/basic/browser/touchUiBrowserSmoke.mts tests/basic/browser/audioLifecycleBrowserSmoke.mts tests/basic/writeCache.test.ts tests/basic/fileSearch.test.ts \
            tests/basic/briefingAudioHealth.test.ts tests/real-game/browser/briefingAudioHealth.ts \
            tests/real-game/browser/ra2BrowserSmoke.mts
          pnpm run check

      - name: Install Chromium and verify touch host controls
        run: |
          pnpm exec playwright install chromium
          pnpm run dev -- --host 127.0.0.1 --strictPort > "$RUNNER_TEMP/ra2-m1-vite.log" 2>&1 &
          vite_pid=$!
          for attempt in {1..60}; do
            if curl --silent --insecure --fail https://127.0.0.1:15174/ > /dev/null; then
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ra2-m1-vite.log"
              exit 1
            fi
            sleep 1
          done
          if ! curl --silent --insecure --fail https://127.0.0.1:15174/ > /dev/null; then
            cat "$RUNNER_TEMP/ra2-m1-vite.log"
            exit 1
          fi
          pnpm run test:browser:touch-ui
          pnpm run test:browser:audio
          pnpm run test:browser:audio-gesture
          RA2_BROWSER_FRESH_CONTEXT=1 pnpm run test:browser:audio-gesture
          pnpm run test:browser:cold-save
          pnpm run test:browser:tap-start

      - name: Assert public-only checkout
        run: node scripts/ios/verifySourceOnly.mjs

      - name: Bundle the public Route B runtime
        run: node scripts/ios/preparePublicBundle.mjs

      - name: Compile and link the unsigned iPhoneOS arm64 app
        run: >-
          xcodebuild -project ios/RA2M1/RA2M1.xcodeproj -scheme RA2M1
          -configuration Release -sdk iphoneos -arch arm64
          -derivedDataPath "$RUNNER_TEMP/ra2-m1-derived"
          RA2_SOURCE_BRANCH="$GITHUB_REF_NAME" RA2_SOURCE_COMMIT="$GITHUB_SHA"
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build

      - name: Run deterministic iOS host, custody, WebKit storage and lifecycle tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in devices.values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPhone")))')"
          xcodebuild test -project ios/RA2M1/RA2M1.xcodeproj -scheme RA2M1 \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ra2-m1-derived" -resultBundlePath "$RUNNER_TEMP/RA2M1-tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""

      - name: Package and verify unsigned owner-data-free artifacts
        run: |
          OUTPUT="$RUNNER_TEMP/ra2-m1-ios-artifacts"
          APP="$RUNNER_TEMP/ra2-m1-derived/Build/Products/Release-iphoneos/RA2M1.app"
          bash scripts/ios/package-ios-artifact.sh "$APP" "$OUTPUT"
          RA2_EXPECTED_SOURCE_BRANCH="$GITHUB_REF_NAME" node scripts/ios/verifyAppleApp.mjs "$APP" "$OUTPUT"
          cat "$OUTPUT/apple-proof-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Apple proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnc-ra2-apple-proof
          path: ${{ runner.temp }}/ra2-m1-ios-artifacts/*
          if-no-files-found: error
          retention-days: 30
